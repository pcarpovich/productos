{% extends "base.html" %}

{% block content %}
    <div class="row mb-3">
        <div class="col">
            <h2>{{ title }}</h2>
        </div>
        <div class="col text-right">
            <a href="{{ url_for('deposits.add_deposit') }}" class="btn btn-primary">Add New Deposit</a>
        </div>
    </div>
    {% if deposits %}
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for deposit in deposits %}
                    <tr>
                        <td>{{ deposit.id }}</td>
                        <td>{{ deposit.name }}</td>
                        <td>
                            <a href="{{ url_for('deposits.edit_deposit', deposit_id=deposit.id) }}" class="btn btn-sm btn-outline-secondary mr-1">Edit</a>
                            <form action="{{ url_for('deposits.delete_deposit', deposit_id=deposit.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this deposit \'{{ deposit.name|tojson }}\'?');">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-info">
            No deposits found. Click "Add New Deposit" to get started!
        </div>
    {% endif %}
{% endblock %}
